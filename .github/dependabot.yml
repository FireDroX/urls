version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet: stay on 6.x and
      # drop this rule once a typescript-eslint release accepts TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      # Minor and patch bumps land in one monthly PR; majors stay separate.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
