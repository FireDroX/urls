# Full stack (mysql + rustfs + backend + frontend) for a blank server or a
# local run. In prod the database and the S3 already exist (shared with
# NestWiki): use docker-compose.external.yml there.
#
# Networks: `database` and `storage` are internal (no outbound traffic),
# shared only with the backend. The frontend sits on `default` alone and
# never sees the database or the storage. Only the frontend port is
# published, on BIND_ADDRESS (127.0.0.1: reachable by the Cloudflare Tunnel
# running on the host); mysql/rustfs on BACKING_BIND_ADDRESS.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_DATABASE:-urls}
      MYSQL_USER: ${DB_USERNAME:-urls}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    ports:
      - "${BACKING_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ADMIN_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_ADMIN_SECRET_KEY:?}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "${BACKING_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_HOST_PORT:-9010}:9000"
    volumes:
      - rustfs-data:/data
    networks:
      - storage

  # One-shot, opt-in: bucket, app user limited to the bucket, quota and
  # CORS. Needs the local infra/rustfs/setup.sh (kept out of the repo):
  #   docker compose --profile setup run --rm storage-init
  storage-init:
    image: rustfs/rc:latest
    profiles: ["setup"]
    restart: "no"
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      RUSTFS_URL: http://rustfs:9000
      RUSTFS_ADMIN_ACCESS_KEY: ${RUSTFS_ADMIN_ACCESS_KEY:?}
      RUSTFS_ADMIN_SECRET_KEY: ${RUSTFS_ADMIN_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-urls}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-urls}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_QUOTA: ${S3_QUOTA:-75G}
      CORS_ORIGIN: ${PUBLIC_URL:?}
    volumes:
      - ./infra/rustfs:/setup:ro
    depends_on:
      - rustfs
    networks:
      - storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      S3_ENDPOINT: http://rustfs:9000
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - default
      - database
      - storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - default

networks:
  database:
    internal: true
  storage:
    internal: true

volumes:
  mysql-data:
  rustfs-data:
